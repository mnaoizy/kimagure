version: v2
plugins:
  - local: protoc-gen-go
    out: server/gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: server/gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/dart
    out: mobile/lib/gen
  - remote: buf.build/protocolbuffers/dart:v21.1.2
    out: mobile/lib/gen
    include_wkt: true
    include_imports: true
