options:
  machineType: "E2_HIGHCPU_8"

steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "asia-northeast1-docker.pkg.dev/$PROJECT_ID/kimagure-server/tts-job",
        "-f",
        "Dockerfile.job",
        ".",
      ]
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "asia-northeast1-docker.pkg.dev/$PROJECT_ID/kimagure-server/tts-job",
      ]
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      [
        "run",
        "jobs",
        "deploy",
        "tts-job",
        "--image",
        "asia-northeast1-docker.pkg.dev/$PROJECT_ID/kimagure-server/tts-job",
        "--region",
        "asia-northeast1",
        "--cpu",
        "4",
        "--memory",
        "4Gi",
        "--set-env-vars",
        "TTS_API_KEY=$_TTS_API_KEY,DATABASE_URL=$_DATABASE_URL",
      ]
images:
  - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/kimagure-server/tts-job"

substitutions:
  _TTS_API_KEY: ""
  _DATABASE_URL: ""
